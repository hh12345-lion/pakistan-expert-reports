[build]
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Briefs POST to Next.js /api/submit-lead and append to Google Sheets.

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
